replicaCount: 3

image:
  repository: asia-south2-docker.pkg.dev/python-project-1st-sep/artifact-ai-python-weather-agent/ai-python-weather-agent
  tag: "1.0"
  pullPolicy: IfNotPresent

container:
  port: 8000

environment:
  ENVIRONMENT: production

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"

  limits:
    cpu: "500m"
    memory: "512Mi"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

  hosts:
    - host: weather-agent.example.com
      paths:
        - path: /
          pathType: Prefix

  tls: []